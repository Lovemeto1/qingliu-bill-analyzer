name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: python -m pip install pip-audit bandit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Scan Python source
        run: python -m bandit -q -r app.py desktop_launcher.py bill_analyzer tools -x tests
