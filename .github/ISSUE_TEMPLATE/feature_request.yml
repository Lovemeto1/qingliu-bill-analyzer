name: 功能建议
description: 提议新功能或分析维度。
title: "[Feature] "
labels: [enhancement]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容和附件中不包含真实账单或个人信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: 是否需要联网或第三方服务
      options:
        - 不需要
        - 可能需要
        - 需要
    validations:
      required: true
  - type: textarea
    id: privacy_impact
    attributes:
      label: 隐私影响
      description: 若涉及联网、遥测或外部 API，请说明数据范围和关闭方式。
